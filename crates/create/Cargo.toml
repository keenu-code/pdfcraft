[package]
name = "pdfcraft-create"
description = "Create PDFs: blank documents, from images (PNG, JPEG), from plain text and from email messages"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-cos = { workspace = true }
pdfcraft-filters = { workspace = true }
pdfcraft-model = { workspace = true }
pdfcraft-fonts = { workspace = true }
# For `image::bmp_with_pixel_offset`, shared with XFA pictures.
pdfcraft-xfa = { workspace = true }
png = "0.18"
tiff = "0.11"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg"] }
# Already in the graph through image; read directly for CMYK JPEG samples, which image converts to RGB.
zune-jpeg = "0.5"
thiserror = { workspace = true }
# Already in the graph through lopdf; used only to read plain-text files (decode_text).
encoding_rs = "0.8"
# Email messages (.eml): the MIME tree, headers, transfer and charset decoding. No features.
mail-parser = { version = "1.0", default-features = false, features = ["full_encoding"] }
# An email's HTML body, and HTML files, as annotated lines (bold, italic, links, pictures); no CSS features.
html2text = { version = "0.17", default-features = false }
# Pictures an HTML file carries inline (`data:` URIs).
base64 = "0.23"
# Outlook messages (.msg): the OLE compound file that holds their MAPI properties. MIT.
cfb = "0.16"
# Already in the graph (pdfcraft-engine): the sent time of an Outlook message as an RFC 2822 date.
chrono = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Already in the graph (pdfcraft-platform, ui-egui); stops a timed-out LibreOffice's whole process
# group, soffice.bin included, without unsafe code.
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
# Outlook message fixtures, written in the tests.
cfb = "0.16"
mail-parser = { version = "1.0", default-features = false, features = ["full_encoding"] }
# An independent CCITT decoder, to check Create PDF's Group 4 images.
hayro-ccitt.workspace = true
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg"] }
hayro-syntax = { workspace = true }
pdfcraft-filters = { workspace = true }
